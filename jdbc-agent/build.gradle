plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.4'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.sshtools'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.sshtools.jdbcagent.JdbcAgentApplication'
}

dependencies {
    implementation 'io.grpc:grpc-netty-shaded:1.68.1'
    implementation 'io.grpc:grpc-protobuf:1.68.1'
    implementation 'io.grpc:grpc-stub:1.68.1'
    implementation 'com.google.protobuf:protobuf-java:4.28.3'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'io.grpc:grpc-testing:1.68.1'
    testImplementation 'com.h2database:h2:2.2.224'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.28.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.68.1'
        }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('shadowJar') {
    archiveFileName = 'sshtools-jdbc-agent-all.jar'
    mergeServiceFiles()
}

tasks.register('printH2Jar') {
    doLast {
        def h2Jar = configurations.testRuntimeClasspath.files.find { it.name.startsWith('h2-') && it.name.endsWith('.jar') }
        if (h2Jar == null) {
            throw new GradleException('未找到 H2 JDBC jar')
        }
        println h2Jar.absolutePath
    }
}
