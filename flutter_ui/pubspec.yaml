name: ahasshtools_flutter
description: AHaSSH Tools Flutter frontend_old for cross-platform support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # HTTP Client
  dio: ^5.4.0

  # WebSocket（3.x 才有 channel.ready，终端需要可靠地等连接就绪再订阅）
  web_socket_channel: ^3.0.3

  # Terminal Emulator（3.5 用了已被 Flutter 移除的 RawKeyEvent，须用 4.x）
  xterm: ^4.0.0

  # Routing
  go_router: ^12.1.3

  # JSON Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.5

  # SFTP 上传时选本地文件（6.x 用已移除的旧嵌入 API，必须用新版）
  file_picker: ^10.0.0

  # 内嵌 Go 核心（gomobile）：在应用进程内启动 API 服务器
  sshtools_go:
    path: plugins/sshtools_go

  # Charts for Monitoring
  fl_chart: ^0.65.0

  # Logging
  logger: ^2.0.2+1

  # UUID Generation
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  riverpod_generator: ^2.3.9

  # App 图标生成（源图与桌面端 build/appicon.png 同一张）
  flutter_launcher_icons: ^0.14.4

# 应用图标：与桌面端共用 build/appicon.png 的拷贝（终端窗 + >_ aha）。
# 源图为 1024×1024 白底满幅插画：Android 自适应图标以白色作背景、
# 整图作前景（系统安全区缩放后四周是同色白边）；iOS 要求无透明通道。
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Assets (if needed)
  # assets:
  #   - assets/images/
  #   - assets/fonts/
