name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows
            arch: amd64
            runner: windows-latest
          # macOS Apple Silicon
          - os: darwin
            arch: arm64
            runner: macos-latest
          # macOS Intel
          - os: darwin
            arch: amd64
            runner: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend && npm install

      - name: Refresh Windows icon from appicon.png
        if: matrix.os == 'windows'
        shell: bash
        run: rm -f build/windows/icon.ico

      - name: Build ${{ matrix.os }} ${{ matrix.arch }}
        shell: bash
        run: |
          VERSION="-ldflags=-X main.Version=${{ github.ref_name }}"
          wails build -platform ${{ matrix.os }}/${{ matrix.arch }} -clean "$VERSION"

      - name: Package macOS
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          cd build/bin

          # Remove quarantine attributes
          xattr -cr AHaSSHTools.app

          # Ad-hoc sign the app
          codesign --force --deep --sign - AHaSSHTools.app || echo "codesign failed, continuing..."

          # Create zip archive
          zip -r AHaSSHTools-macos-${{ matrix.arch }}.zip AHaSSHTools.app

      - name: Upload artifact - ${{ matrix.os }} ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: AHaSSHTools-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/bin/*.exe
            build/bin/*.zip
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/AHaSSHTools-windows-amd64/*.exe
            artifacts/AHaSSHTools-darwin-arm64/*.zip
            artifacts/AHaSSHTools-darwin-amd64/*.zip
          body: |
            
            # 更新说明：
            - 版本号：${{ github.ref_name }}
            - 更新时间：${{ github.event.release.published_at }}
            - 更新内容：
              - 新增功能：
                - 数据库侧栏库/Schema 右键支持新建查询、运行 SQL 文件、刷新、断开；选完 `.sql` 后后台执行并显示进度，可取消
                - SSH 连接可选择终端编码（UTF-8 / GBK / GB2312 / GB18030 / Big5）；已打开会话可在终端内热切换，粘贴与新输出立即按新编码处理，无需重连
                - AI 助手能拿到当前打开的表、索引或键，按 JDBC / Redis / ES 等数据源使用对应只读工具
                - 文件管理支持 Ctrl+V / Cmd+V 粘贴本地文件或文件夹；选中文件夹时传到该目录，且与现有上传共用串行队列
                - 资产树文件夹支持右键「新建连接」，分组字段自动带入该文件夹路径；分组可用 `/` 表示多级目录
                - 会话标签右键支持全部关闭、关闭左侧、关闭右侧、关闭其它；已连接 SSH 批量关闭只确认一次
                - 设置中「整体外观」与「终端主题」分开：终端可独立深色、浅色或跟随界面
                - Oracle 支持表结构查看与新建/修改（设计器生成 VARCHAR2、NUMBER 等）
                - 文件管理支持文件夹上传：工具栏、右键菜单和拖放均可上传目录树（含空子目录）
                - 上传遇到同名文件可选择覆盖或重命名；同名文件夹可全部覆盖或逐个选择
                - 数据库表数据支持复选框多选：批量复制、复制为 INSERT、改字段、删除；删改/翻页后保留筛选与排序
                - 服务器性能页增加「实时」开关（按会话，默认关）与手动刷新；切走性能页时停止采集，减轻弱机压力
                - 搜索/缓存（ES、Redis 等）与关系库在连接侧剥离：资产树不再错误展开「数据库」；双击打开专用工作区，会话标签与 AI 助手按域分流
                - Redis / Elasticsearch 工作区升级：键 MATCH 扫描与续扫、新建/批量删键、CLI 白名单；ES Discover 分页、Dev Tools、建删索引；AI 可只读查询并经确认执行原生变更
                - 消息队列新增 Apache RocketMQ、RabbitMQ 原生连接（Go，无需安装 JDBC/JRE）；支持认证「无」；可连通并浏览 Topic/Queue 只读详情
                - 添加连接按细分类分组（关系型 / 国产 / 轻量 / 文档·缓存·检索 / 图谱·时序 / 消息队列）；JDBC 驱动管理增加左侧分类导航（消息队列为内置原生，不进驱动安装清单）
                - Kafka 连接支持认证「无」，无密码 Broker 可直接测试、保存与打开
              - 修复问题：
                - 数据库表删除或保存后筛选与排序被重置：刷新查询未沿用当前条件
                - Oracle 等库删除含 NULL 字段记录失败 ORA-00908：WHERE 误写 `= NULL`
                - 文件夹上传拖垮 SSH：每个文件一个 goroutine，打满同一条连接上的 sftp-server
                - 会话工具「文件 / 性能」互斥卸载：切走后目录跟踪回到家目录，监控曲线要重新采集
                - SSH 场景 AI 助手「当前」显示 mysql：SSH 资产误存默认 db_type，上下文误判为数据库
                - SSH 终端按 Command 会滚到底导致无法复制上方内容；缺少右键复制，粘贴中文乱码且无编码设置
                - SSH 终端 Cmd+V 粘贴失效：`pasteFromClipboard` 未定义导致快捷键路径报错
                - SSH 终端滚屏后按上/下键翻命令历史时，方向键被 xterm 用来滚历史输出，当前行被清掉
                - AI 助手输入框：中文输入法组字时按回车会误发送；生成中可点「停止」
                - ES/Redis AI 助手无「填入/执行」：原生 artifact 解析失败且工作区未接事件
                - ES AI 先贴裸 DSL 再贴 native_query 时解析不到 artifact，聊天无填入/执行按钮
                - Redis CLI 命令框被挤成竖条或过高；AI 填入 SCAN 数组被转成带逗号命令导致执行失败
                - Redis AI「填入」一律进 CLI：浏览类 SCAN/通配应写入顶部 MATCH 并扫描；MATCH 输入误自动首字母大写
                - Windows 安装包和 exe 仍显示 Wails 默认 W 图标：未从 appicon.png 更新 icon.ico
                - 文件夹右键「新建连接」未带入分组；右键菜单偏离点击位置，Mac 触控板容易选中文字
                - 性能监控页一直停在「实时数据获取中…」、指标为 0：SSH 会话未标记类型导致远程命令被拒绝
                - Oracle 表结构加载失败 `ORA-17008: 已关闭连接`：失效会话自动重开并顺序读取元数据
                - Oracle 建表 `ORA-00922`：去掉 JDBC 无法执行的 `ENABLE` 与物理存储子句
                - Oracle 对象详情 `ORA-17027: 流已被关闭`：按列序只读一次 LONG 字段
              - 优化体验：
                - 终端配色不再被整体浅色/深色主题强制成黑底
                - 上传重名采用与粘贴相同的 `copy` 后缀；覆盖时先删除再写入，避免部分 SFTP 服务器拒绝截断
                - Redis CLI 页签保留左侧键列表；紧凑命令框与结果区分层显示
            
            ## AHaSSHTools ${{ github.ref_name }}

            ### 下载说明

            **Windows**:
            - 下载 `AHaSSHTools.exe`
            - 直接运行即可

            **macOS (Apple Silicon / M1/M2/M3)**:
            - 下载 `AHaSSHTools-macos-arm64.zip`
            - 解压后运行以下命令移除隔离属性：
              ```bash
              xattr -cr AHaSSHTools.app
              open AHaSSHTools.app
              ```

            **macOS (Intel)**:
            - 下载 `AHaSSHTools-macos-amd64.zip`
            - 解压后运行以下命令移除隔离属性：
              ```bash
              xattr -cr AHaSSHTools.app
              open AHaSSHTools.app
              ```
            
            更多信息请访问 [项目主页](https://github.com/${{ github.repository }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
