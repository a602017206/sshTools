name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows
            arch: amd64
            runner: windows-latest
          # macOS Apple Silicon
          - os: darwin
            arch: arm64
            runner: macos-latest
          # macOS Intel
          - os: darwin
            arch: amd64
            runner: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend && npm install

      - name: Build ${{ matrix.os }} ${{ matrix.arch }}
        shell: bash
        run: |
          VERSION="-ldflags=-X main.Version=${{ github.ref_name }}"
          wails build -platform ${{ matrix.os }}/${{ matrix.arch }} -clean "$VERSION"

      - name: Package macOS
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          cd build/bin

          # Remove quarantine attributes
          xattr -cr AHaSSHTools.app

          # Ad-hoc sign the app
          codesign --force --deep --sign - AHaSSHTools.app || echo "codesign failed, continuing..."

          # Create zip archive
          zip -r AHaSSHTools-macos-${{ matrix.arch }}.zip AHaSSHTools.app

      - name: Upload artifact - ${{ matrix.os }} ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: AHaSSHTools-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/bin/*.exe
            build/bin/*.zip
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/AHaSSHTools-windows-amd64/*.exe
            artifacts/AHaSSHTools-darwin-arm64/*.zip
            artifacts/AHaSSHTools-darwin-amd64/*.zip
          body: |
            
            # 更新说明：
            - 版本号：${{ github.ref_name }}
            - 更新时间：${{ github.event.release.published_at }}
            - 更新内容：
              - 新增功能：
                - 右侧 SFTP 文件管理支持从本地文件管理器拖放文件上传到当前远程目录。
                - 连接右键菜单新增“克隆连接”，自动生成可编辑的“名称 copy 时间戳”。
              - 修复问题：
                - 新增连接时不再保留上一次填写的连接信息。
                - 终端支持 Ctrl/Cmd+C、Ctrl/Cmd+V、Ctrl+Shift+C、Ctrl+Shift+V 和 Shift+Insert 等常用快捷键。
                - 连接列表改为双击连接，避免单击误打开多个会话。
                - 上传历史和开发工具改为居中弹窗，不再占用工作区边缘或底部空间。
                - 修复编辑连接时旧连接信息覆盖新连接表单的问题。
                - 修复切换编辑连接时首次打开显示空表单的问题。
                - 修复用户名输入被系统自动将首字母大写的问题，用户名将按输入内容原样保存。
                - 修复编辑后新建连接错误复用上一份编辑表单数据的问题。
                - 上传历史和开发工具统一为与全局设置一致的居中门户弹窗，不再挤压工作区。
                - 修复数据库数据行右键菜单偏离选中单元格，且支持点击菜单外任意位置关闭。
              - 优化体验：
                - 有选区时 Ctrl/Cmd+C 复制；无选区时仍向远端发送中断信号。
            
            ## AHaSSHTools ${{ github.ref_name }}

            ### 下载说明

            **Windows**:
            - 下载 `AHaSSHTools.exe`
            - 直接运行即可

            **macOS (Apple Silicon / M1/M2/M3)**:
            - 下载 `AHaSSHTools-macos-arm64.zip`
            - 解压后运行以下命令移除隔离属性：
              ```bash
              xattr -cr AHaSSHTools.app
              open AHaSSHTools.app
              ```

            **macOS (Intel)**:
            - 下载 `AHaSSHTools-macos-amd64.zip`
            - 解压后运行以下命令移除隔离属性：
              ```bash
              xattr -cr AHaSSHTools.app
              open AHaSSHTools.app
              ```
            
            更多信息请访问 [项目主页](https://github.com/${{ github.repository }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
