name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows
            arch: amd64
            runner: windows-latest
          # macOS Apple Silicon
          - os: darwin
            arch: arm64
            runner: macos-latest
          # macOS Intel
          - os: darwin
            arch: amd64
            runner: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend && npm install

      - name: Refresh Windows icon from appicon.png
        if: matrix.os == 'windows'
        shell: bash
        run: rm -f build/windows/icon.ico

      - name: Build ${{ matrix.os }} ${{ matrix.arch }}
        shell: bash
        run: |
          VERSION="-ldflags=-X main.Version=${{ github.ref_name }}"
          wails build -platform ${{ matrix.os }}/${{ matrix.arch }} -clean "$VERSION"

      - name: Package macOS
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          cd build/bin

          # Remove quarantine attributes
          xattr -cr AHaSSHTools.app

          # Ad-hoc sign the app
          codesign --force --deep --sign - AHaSSHTools.app || echo "codesign failed, continuing..."

          # Create zip archive
          zip -r AHaSSHTools-macos-${{ matrix.arch }}.zip AHaSSHTools.app

      # 在 zip 之外额外打一个 DMG，方便用户拖拽安装；zip 保留以兼容旧下载链接。
      # 这里用 hdiutil 直接制作 UDZO 压缩镜像，避免引入第三方 action 的签名/公证依赖。
      - name: Package macOS DMG
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          cd build/bin

          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="AHaSSHTools-macos-${{ matrix.arch }}-${VERSION}.dmg"
          STAGING="$(mktemp -d)"

          # 安装界面：应用图标 + 指向 /Applications 的软链接，用户可直接拖入安装
          cp -R AHaSSHTools.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          # 剔除扩展属性并再次 ad-hoc 签名，保证镜像内的包状态与 zip 一致
          xattr -cr "$STAGING/AHaSSHTools.app"
          codesign --force --deep --sign - "$STAGING/AHaSSHTools.app" || echo "codesign failed, continuing..."

          hdiutil create \
            -volname "AHaSSHTools ${VERSION}" \
            -srcfolder "$STAGING" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "$DMG_NAME"

          rm -rf "$STAGING"
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"
          ls -lh "$DMG_NAME" "$DMG_NAME.sha256"

      - name: Upload artifact - ${{ matrix.os }} ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: AHaSSHTools-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/bin/*.exe
            build/bin/*.zip
            build/bin/*.dmg
            build/bin/*.dmg.sha256
          retention-days: 7

  # Android 发布包：与 mobile.yml 同一套构建（内嵌 Go + 签名 + 分 ABI），
  # 产物统一改 AHaSSHTools- 前缀后挂到 Release。签名缺失时回退 debug 包，
  # 仅供验证，不要对外宣称正式版。
  android:
    name: Android release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install gomobile (version locked by mobile/go.mod)
        shell: bash
        run: |
          GOMOBILE_VERSION="$(cd mobile && go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Test embedded Go module
        working-directory: mobile
        run: go test ./...

      - name: Build Android library from Go core
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          PLUGIN_ANDROID=flutter_ui/plugins/sshtools_go/android
          mkdir -p "$PLUGIN_ANDROID/libs" "$PLUGIN_ANDROID/src/main/jniLibs"
          cd mobile
          # 16KB 页对齐：安卓 16 设备拒绝加载 4KB 对齐的 .so（见 mobile.yml 注释）
          gomobile bind -target=android -androidapi 24 \
            -ldflags "-s -w -extldflags=-Wl,-z,max-page-size=16384" \
            -o "$RUNNER_TEMP/sshtools.aar" .
          cd "$RUNNER_TEMP"
          unzip -o -q sshtools.aar -d sshtools_aar
          cp sshtools_aar/classes.jar "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/libs/sshtools-classes.jar"
          cp -r sshtools_aar/jni/* "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/src/main/jniLibs/"
          # 16KB 对齐断言：任一 ABI 的 libgojni.so 小于 16KB 对齐直接红
          python3 - "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/src/main/jniLibs" <<'PYEOF'
          import glob, struct, sys
          bad = []
          for path in sorted(glob.glob(sys.argv[1] + "/**/*.so", recursive=True)):
              with open(path, "rb") as fh:
                  data = fh.read(65536)
              is64 = data[4] == 2
              if is64:
                  phoff = struct.unpack("<Q", data[32:40])[0]
                  phentsize = struct.unpack("<H", data[54:56])[0]
                  phnum = struct.unpack("<H", data[56:58])[0]
                  aoff, awid = 48, 8
              else:
                  phoff = struct.unpack("<I", data[28:32])[0]
                  phentsize = struct.unpack("<H", data[42:44])[0]
                  phnum = struct.unpack("<H", data[44:46])[0]
                  aoff, awid = 28, 4
              with open(path, "rb") as fh:
                  fh.seek(phoff)
                  ph = fh.read(phentsize * phnum)
              aligns = []
              for i in range(phnum):
                  o = i * phentsize
                  if struct.unpack("<I", ph[o:o + 4])[0] == 1:
                      aligns.append(struct.unpack("<Q" if is64 else "<I", ph[o + aoff:o + aoff + awid])[0])
              if not aligns or min(aligns) < 0x4000:
                  bad.append(path)
          if bad:
              print("FAIL: not 16KB aligned:", bad)
              sys.exit(1)
          print("all .so are 16KB aligned")
          PYEOF

      - name: Generate scaffolding and app identity
        working-directory: flutter_ui
        shell: bash
        run: |
          flutter create --platforms=android,ios --org com.ahasshtools --project-name ahasshtools_flutter .
          flutter pub get
          dart run flutter_launcher_icons
          # 清单三件事：显示名 AHaSSHTools、INTERNET 权限、回环明文放行
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="AHaSSHTools"\n        android:networkSecurityConfig="@xml/network_security_config"|' "$MANIFEST"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- API 只走本机回环（内嵌 Go 服务），仅对回环地址放行明文 HTTP -->
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
          </network-security-config>
          EOF

      - name: Keep gomobile bridge classes from R8
        working-directory: flutter_ui/android
        shell: bash
        run: |
          cat > app/proguard-rules.pro <<'EOF'
          # gomobile 桥接：方法由 Go 运行时经 JNI 按名调用，必须原样保留
          -keep class go.** { *; }
          -keep class mobile.** { *; }
          -keep class com.ahasshtools.sshtools_go.** { *; }
          EOF
          cat >> app/build.gradle.kts <<'EOF'

          android {
              buildTypes {
                  getByName("release") {
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          }
          EOF

      - name: Inject release signing
        working-directory: flutter_ui/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KS_B64" ]; then
            echo "signing secrets missing, will fall back to debug build"
            exit 0
          fi
          KS_PATH="$RUNNER_TEMP/release.jks"
          echo "$KS_B64" | base64 -d > "$KS_PATH"
          cat > key.properties <<EOF
          storeFile=$KS_PATH
          storePassword=$KS_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF
          sed -i '1i import java.util.Properties\nimport java.io.FileInputStream' app/build.gradle.kts
          cat >> app/build.gradle.kts <<'EOF'

          val keystorePropsFile = rootProject.file("key.properties")
          val keystoreProps = Properties()
          if (keystorePropsFile.exists()) {
              keystoreProps.load(FileInputStream(keystorePropsFile))
          }
          android {
              signingConfigs {
                  create("release") {
                      if (keystorePropsFile.exists()) {
                          storeFile = file(keystoreProps.getProperty("storeFile"))
                          storePassword = keystoreProps.getProperty("storePassword")
                          keyAlias = keystoreProps.getProperty("keyAlias")
                          keyPassword = keystoreProps.getProperty("keyPassword")
                      }
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          echo "release signing injected"

      - name: Build APKs and assert invariants
        working-directory: flutter_ui
        shell: bash
        run: |
          flutter pub get
          if [ -f android/key.properties ]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --debug
          fi
          cd build/app/outputs/flutter-apk
          # 发布断言：桥接方法没被 R8 裁、清单有 INTERNET，缺一直接红
          for apk in *.apk; do
            unzip -p "$apk" 'classes*.dex' 2>/dev/null | grep -aq 'getRef' || { echo "$apk: Seq.getRef MISSING"; exit 1; }
            unzip -p "$apk" AndroidManifest.xml | tr -d '\000' | grep -aq 'android.permission.INTERNET' || { echo "$apk: INTERNET MISSING"; exit 1; }
            echo "$apk OK"
          done
          mkdir -p "$RUNNER_TEMP/android-out"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src=$(ls app-${abi}-*.apk)
            cp "$src" "$RUNNER_TEMP/android-out/AHaSSHTools-android-${abi}.apk"
          done
          ls -lh "$RUNNER_TEMP/android-out"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: AHaSSHTools-android
          path: ${{ runner.temp }}/android-out/*.apk
          retention-days: 7

  # iOS 发布包：无 Apple 开发者签名时只能出未签名 IPA（自签后安装），
  # 包体结构与正式 IPA 一致（Payload/Runner.app），Release 里会显著标注。
  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install gomobile (version locked by mobile/go.mod)
        shell: bash
        run: |
          GOMOBILE_VERSION="$(cd mobile && go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build iOS XCFramework from Go core
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p flutter_ui/plugins/sshtools_go/ios/Frameworks
          cd mobile
          gomobile bind -target=ios -ldflags "-s -w" \
            -o ../flutter_ui/plugins/sshtools_go/ios/Frameworks/Mobile.xcframework \
            .

      - name: Generate scaffolding and app identity
        working-directory: flutter_ui
        shell: bash
        run: |
          flutter create --platforms=android,ios --org com.ahasshtools --project-name ahasshtools_flutter .
          flutter pub get
          dart run flutter_launcher_icons
          python3 - <<'PYEOF'
          import plistlib
          path = "ios/Runner/Info.plist"
          with open(path, "rb") as fh:
              plist = plistlib.load(fh)
          plist["CFBundleName"] = "AHaSSHTools"
          plist["CFBundleDisplayName"] = "AHaSSHTools"
          plist["NSAppTransportSecurity"] = {"NSAllowsLocalNetworking": True}
          with open(path, "wb") as fh:
              plistlib.dump(plist, fh)
          print("iOS identity set")
          PYEOF

      - name: Build unsigned IPA
        working-directory: flutter_ui
        shell: bash
        run: |
          flutter pub get
          flutter build ios --no-codesign --release
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry AHaSSHTools-ios-unsigned.ipa Payload
          ls -lh AHaSSHTools-ios-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AHaSSHTools-ios
          path: ${{ runner.temp }}/AHaSSHTools-ios-unsigned.ipa
          retention-days: 7

  release:
    name: Create Release
    needs: [build, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/AHaSSHTools-windows-amd64/*.exe
            artifacts/AHaSSHTools-darwin-arm64/*.zip
            artifacts/AHaSSHTools-darwin-arm64/*.dmg
            artifacts/AHaSSHTools-darwin-arm64/*.dmg.sha256
            artifacts/AHaSSHTools-darwin-amd64/*.zip
            artifacts/AHaSSHTools-darwin-amd64/*.dmg
            artifacts/AHaSSHTools-darwin-amd64/*.dmg.sha256
            artifacts/AHaSSHTools-android/*.apk
            artifacts/AHaSSHTools-ios/*.ipa
          body: |
            
            # 更新说明：
            - 版本号：${{ github.ref_name }}
            - 更新时间：${{ github.event.release.published_at }}
            - 更新内容：
              - 新增功能：
                - Docker 工作区列表搜索：容器 / 镜像 / 网络 / 卷四类资源各自独立搜索框，按可见列即时过滤（不区分大小写）；容器可与「仅运行中」组合使用
              
            
            ## AHaSSHTools ${{ github.ref_name }}

            ### 下载说明

            **Windows**:
            - 下载 `AHaSSHTools.exe`
            - 直接运行即可

            **macOS (Apple Silicon / M1/M2/M3)**:
            - 推荐下载 `AHaSSHTools-macos-arm64-<版本>.dmg`，打开后把 `AHaSSHTools.app` 拖入 `Applications` 即可
            - 首次启动若提示“已损坏”或“无法验证开发者”，在终端执行一次：
              ```bash
              xattr -cr /Applications/AHaSSHTools.app
              ```
            - 也可以下载 `AHaSSHTools-macos-arm64.zip`，解压后运行 `xattr -cr AHaSSHTools.app && open AHaSSHTools.app`
            - DMG 同名 `.sha256` 文件可用于校验下载完整性：`shasum -a 256 -c <文件名>.sha256`

            **macOS (Intel)**:
            - 推荐下载 `AHaSSHTools-macos-amd64-<版本>.dmg`，打开后把 `AHaSSHTools.app` 拖入 `Applications` 即可
            - 首次启动若提示“已损坏”或“无法验证开发者”，在终端执行一次：
              ```bash
              xattr -cr /Applications/AHaSSHTools.app
              ```
            - 也可以下载 `AHaSSHTools-macos-amd64.zip`，解压后运行 `xattr -cr AHaSSHTools.app && open AHaSSHTools.app`
            - DMG 同名 `.sha256` 文件可用于校验下载完整性：`shasum -a 256 -c <文件名>.sha256`

            **Android**:
            - 下载 `AHaSSHTools-android-arm64-v8a.apk`（绝大多数手机），直接安装即可
            - 老款 32 位手机选 `armeabi-v7a`，电脑模拟器选 `x86_64`

            **iOS（未签名）**:
            - 下载 `AHaSSHTools-ios-unsigned.ipa`；该包没有 Apple 签名，无法直接安装，
              需用 AltStore / Sideloadly 等工具在设备上自签后使用
            
            更多信息请访问 [项目主页](https://github.com/${{ github.repository }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
