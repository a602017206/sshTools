name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows
            arch: amd64
            runner: windows-latest
          # macOS Apple Silicon
          - os: darwin
            arch: arm64
            runner: macos-latest
          # macOS Intel
          - os: darwin
            arch: amd64
            runner: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend && npm install

      - name: Refresh Windows icon from appicon.png
        if: matrix.os == 'windows'
        shell: bash
        run: rm -f build/windows/icon.ico

      - name: Build ${{ matrix.os }} ${{ matrix.arch }}
        shell: bash
        run: |
          VERSION="-ldflags=-X main.Version=${{ github.ref_name }}"
          wails build -platform ${{ matrix.os }}/${{ matrix.arch }} -clean "$VERSION"

      - name: Package macOS
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          cd build/bin

          # Remove quarantine attributes
          xattr -cr AHaSSHTools.app

          # Ad-hoc sign the app
          codesign --force --deep --sign - AHaSSHTools.app || echo "codesign failed, continuing..."

          # Create zip archive
          zip -r AHaSSHTools-macos-${{ matrix.arch }}.zip AHaSSHTools.app

      - name: Upload artifact - ${{ matrix.os }} ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: AHaSSHTools-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/bin/*.exe
            build/bin/*.zip
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/AHaSSHTools-windows-amd64/*.exe
            artifacts/AHaSSHTools-darwin-arm64/*.zip
            artifacts/AHaSSHTools-darwin-amd64/*.zip
          body: |
            
            # 更新说明：
            - 版本号：${{ github.ref_name }}
            - 更新时间：${{ github.event.release.published_at }}
            - 更新内容：
              - 新增功能：
                - 会话日志：自动记录终端输出，支持搜索/导出、可配置保留天数与敏感信息过滤（默认开启，保留 30 天）
                - 常用命令提示：按连接统计频率，输入时 Tab/点击填入后再回车执行
                - 文件管理器目录跟踪默认开启（已关闭的连接保持用户选择）
                - Copilot 多模型：可配置多个服务商（DeepSeek / OpenAI / Ollama / 自定义）及多个模型，对话时切换并记住上次选用；密钥按服务商加密存储
                - 按服务商获取模型列表：设置页「获取模型」调用 OpenAI 兼容 `/v1/models`，可加入选中或全部，已有自定义名称不覆盖
                - 文件在线编辑：文本和配置文件可在文件管理中右键打开，弹窗带语法高亮；可按文件类型和内容格式化并撤销；Ctrl+S / ⌘S 直接保存到服务器

              - 修复问题：
                - 上传任务显示真实文件名、大小和字节进度，进行中的任务不再丢失
                - SSH 终端复制含 {} 的日志时剪贴板变成空白
                - SSH 终端在 tail -f 时复制日志得到空剪贴板，Ctrl+V 不能粘贴
                - 文件管理把访问过的目录误当成已收藏，且没有查看收藏的入口
                - AI 设置中添加服务商/模型后界面不立即刷新
                - Wails 绑定生成时报 `Not found: time.Time`
                - SSH 终端 vim 等全屏程序画面被拆散（关闭 xterm 的 convertEol，避免 LF 被误当成回车换行）

              - 优化体验：
                - 对话输入框旁增加模型选择器，选项为「显示名 · 服务商名」
              
            
            ## AHaSSHTools ${{ github.ref_name }}

            ### 下载说明

            **Windows**:
            - 下载 `AHaSSHTools.exe`
            - 直接运行即可

            **macOS (Apple Silicon / M1/M2/M3)**:
            - 下载 `AHaSSHTools-macos-arm64.zip`
            - 解压后运行以下命令移除隔离属性：
              ```bash
              xattr -cr AHaSSHTools.app
              open AHaSSHTools.app
              ```

            **macOS (Intel)**:
            - 下载 `AHaSSHTools-macos-amd64.zip`
            - 解压后运行以下命令移除隔离属性：
              ```bash
              xattr -cr AHaSSHTools.app
              open AHaSSHTools.app
              ```
            
            更多信息请访问 [项目主页](https://github.com/${{ github.repository }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
