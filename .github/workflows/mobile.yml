name: Mobile Build

# 移动端（Flutter + 内嵌 Go）打包验证流水线。
# 本地不做打包：所有 gomobile 绑定与 Flutter 构建都在 GitHub 托管 runner 上完成。
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/mobile-flutter-gomobile'
    paths:
      - 'mobile/**'
      - 'internal/**'
      - 'flutter_ui/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/mobile.yml'

jobs:
  android:
    name: Android APK (Flutter + gomobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # mobile 子模块的 go 指令以 x/mobile 锁定版本为准（见 mobile/go.mod）
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install gomobile (version locked by mobile/go.mod)
        shell: bash
        run: |
          GOMOBILE_VERSION="$(cd mobile && go list -m -f '{{.Version}}' golang.org/x/mobile)"
          echo "gomobile version: $GOMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Test embedded Go module
        working-directory: mobile
        run: go test ./...

      - name: Build Android library from Go core
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          # gomobile 生成 AAR 后必须解包：Android 库工程（Flutter 插件）
          # 不能直接依赖本地 .aar，需拆成 classes.jar + jniLibs/*.so。
          PLUGIN_ANDROID=flutter_ui/plugins/sshtools_go/android
          mkdir -p "$PLUGIN_ANDROID/libs" "$PLUGIN_ANDROID/src/main/jniLibs"
          cd mobile
          # -z max-page-size=16384：安卓 16 启用 16KB 内存页的设备（如三星
          # S23+ 升 One UI 8）会拒绝加载仅 4KB 对齐的 .so，App 一启动就
          # 闪退。Go 核心库必须按 16KB 最大页尺寸链接。
          gomobile bind -target=android -androidapi 24 \
            -ldflags "-s -w -extldflags=-Wl,-z,max-page-size=16384" \
            -o "$RUNNER_TEMP/sshtools.aar" .
          cd "$RUNNER_TEMP"
          unzip -o -q sshtools.aar -d sshtools_aar
          cp sshtools_aar/classes.jar "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/libs/sshtools-classes.jar"
          cp -r sshtools_aar/jni/* "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/src/main/jniLibs/"
          find "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/src/main/jniLibs" -name '*.so' | sort
          ls -lh "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/libs/"
          # 16KB 页对齐断言：任一 ABI 的 libgojni.so 段对齐 <16KB 直接红，
          # 防止链接参数被误改后，安卓 16 设备闪退的问题悄悄回归
          python3 - "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/src/main/jniLibs" <<'PYEOF'
          import glob, struct, sys
          root = sys.argv[1]
          bad = []
          for path in sorted(glob.glob(root + "/**/*.so", recursive=True)):
              with open(path, "rb") as fh:
                  data = fh.read(65536)
              is64 = data[4] == 2  # EI_CLASS: 2=ELF64，1=ELF32（armeabi-v7a）
              if is64:
                  phoff = struct.unpack("<Q", data[32:40])[0]
                  phentsize = struct.unpack("<H", data[54:56])[0]
                  phnum = struct.unpack("<H", data[56:58])[0]
                  align_at = 48
              else:
                  phoff = struct.unpack("<I", data[28:32])[0]
                  phentsize = struct.unpack("<H", data[42:44])[0]
                  phnum = struct.unpack("<H", data[44:46])[0]
                  align_at = 28
              with open(path, "rb") as fh:
                  fh.seek(phoff)
                  ph = fh.read(phentsize * phnum)
              aligns = []
              for i in range(phnum):
                  off = i * phentsize
                  if struct.unpack("<I", ph[off : off + 4])[0] != 1:
                      continue
                  if is64:
                      aligns.append(struct.unpack("<Q", ph[off + align_at : off + align_at + 8])[0])
                  else:
                      aligns.append(struct.unpack("<I", ph[off + align_at : off + align_at + 4])[0])
              print(path, [hex(a) for a in aligns])
              if not aligns or min(aligns) < 0x4000:
                  bad.append(path)
          if bad:
              print("FAIL: not 16KB aligned:", bad)
              sys.exit(1)
          print("all .so are 16KB aligned")
          PYEOF

      # 仓库未提交 Flutter 平台工程脚手架，统一在流水线里生成，
      # 避免本地无 Flutter SDK 时手写模板与工具链版本漂移。
      # 双平台脚手架一起生成：图标生成工具会同时写 Android 与 iOS，
      # 缺一端目录会直接失败；多出的另一端模板只是文件，不参与本次构建
      - name: Generate Android scaffolding
        working-directory: flutter_ui
        run: flutter create --platforms=android,ios --org com.ahasshtools --project-name ahasshtools_flutter .

      # 应用图标与桌面端共用一张图（flutter_ui/assets/icon/icon.png，
      # 拷贝自 build/appicon.png），脚手架生成后刷进各密度目录
      - name: Apply app icon
        working-directory: flutter_ui
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      # 应用清单三件事（脚手架默认都不满足正式包需求）：
      # 1) 显示名与桌面端统一（wails.json 的 name：AHaSSHTools）；
      # 2) INTERNET 权限：脚手架只在 debug 清单里给，正式包主清单没有，
      #    否则连 127.0.0.1 的内嵌 Go 服务都会被系统拒（真机表现为
      #    前端报 No internet connection、添加连接失败）；
      # 3) 明文放行：安卓 9+ 默认禁明文，我们的 API 只走本机回环，
      #    用 network_security_config 只对 127.0.0.1/localhost 放行。
      - name: Configure Android manifest (name, INTERNET, loopback cleartext)
        working-directory: flutter_ui
        shell: bash
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="AHaSSHTools"\n        android:networkSecurityConfig="@xml/network_security_config"|' "$MANIFEST"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- API 只走本机回环（内嵌 Go 服务），仅对回环地址放行明文 HTTP -->
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
          </network-security-config>
          EOF
          grep -E 'label|INTERNET|networkSecurityConfig' "$MANIFEST" | head -5

      # R8 保留 gomobile 桥接类：Seq.getRef 等方法只被 Go 运行时经 JNI
      # 按名查找，Java 侧无静态引用，release 的 R8 会裁剪/改名，
      # 真机启动即 'failed to find method Seq.getRef' 直接 SIGABRT
      # （三星 S23+ 安卓 16 实测，调试包不开 R8 所以正常）。
      # 与桌面同理，凡 JNI 按名调用的类必须整包原样保留。
      - name: Keep gomobile bridge classes from R8
        working-directory: flutter_ui/android
        shell: bash
        run: |
          cat > app/proguard-rules.pro <<'EOF'
          # gomobile 桥接：方法由 Go 运行时经 JNI 按名调用，必须原样保留
          -keep class go.** { *; }
          -keep class mobile.** { *; }
          -keep class com.ahasshtools.sshtools_go.** { *; }
          EOF
          cat >> app/build.gradle.kts <<'EOF'

          // 由 mobile.yml 注入：为 gomobile 桥接类挂 R8 保留规则（同签名的二次 android 块技巧）
          android {
              buildTypes {
                  getByName("release") {
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          }
          EOF
          echo "proguard keep rules injected"

      # 固定发布签名：密钥只存在于 GitHub Secrets，解出后写 key.properties
      # 并给脚手架的 app/build.gradle.kts 追加签名配置（模板默认没有）。
      # 有了固定签名，后续版本才能覆盖安装、保留应用数据。
      # Secrets 缺失时（如 fork）跳过，走下面的 debug 兜底构建。
      - name: Inject release signing
        working-directory: flutter_ui/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KS_B64" ]; then
            echo "signing secrets missing, will fall back to debug build"
            exit 0
          fi
          KS_PATH="$RUNNER_TEMP/release.jks"
          echo "$KS_B64" | base64 -d > "$KS_PATH"
          cat > key.properties <<EOF
          storeFile=$KS_PATH
          storePassword=$KS_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF
          # 新版 Gradle 里 java 被扩展访问器占用，java.util.* 需靠文件头 import
          sed -i '1i import java.util.Properties\nimport java.io.FileInputStream' app/build.gradle.kts
          cat >> app/build.gradle.kts <<'EOF'

          // 由 mobile.yml 注入的发布签名（flutter create 的脚手架默认只有 debug 签名）
          val keystorePropsFile = rootProject.file("key.properties")
          val keystoreProps = Properties()
          if (keystorePropsFile.exists()) {
              keystoreProps.load(FileInputStream(keystorePropsFile))
          }
          android {
              signingConfigs {
                  create("release") {
                      if (keystorePropsFile.exists()) {
                          storeFile = file(keystoreProps.getProperty("storeFile"))
                          storePassword = keystoreProps.getProperty("storePassword")
                          keyAlias = keystoreProps.getProperty("keyAlias")
                          keyPassword = keystoreProps.getProperty("keyPassword")
                      }
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          echo "release signing injected"

      - name: Build APK
        working-directory: flutter_ui
        run: |
          flutter pub get
          if [ -f android/key.properties ]; then
            # 按 ABI 拆分，避免单个 APK 背着三个架构的 Go 库
            flutter build apk --release --split-per-abi
          else
            flutter build apk --debug
          fi
          ls -lh build/app/outputs/flutter-apk/

      # 发布断言（任一不满足直接红）：
      # 1) Seq.getRef 必须原样留在 dex 里：它只被 Go 经 JNI 按名调用，
      #    被 R8 裁后真机启动即 SIGABRT（见上）；
      # 2) 清单必须含 INTERNET 权限：脚手架只在 debug 清单给，
      #    正式包缺了连 127.0.0.1 都被系统拒（真机报 No internet connection）。
      #    二进制清单是 UTF-16，tr 去空字节后再 grep。
      - name: Assert release APK invariants (bridge kept, INTERNET granted)
        working-directory: flutter_ui/build/app/outputs/flutter-apk
        shell: bash
        run: |
          for apk in *.apk; do
            if unzip -p "$apk" 'classes*.dex' 2>/dev/null | grep -aq 'getRef'; then
              echo "$apk: Seq.getRef present"
            else
              echo "$apk: Seq.getRef MISSING (R8 stripped gomobile bridge)"
              exit 1
            fi
            if unzip -p "$apk" AndroidManifest.xml | tr -d '\000' | grep -aq 'android.permission.INTERNET'; then
              echo "$apk: INTERNET permission present"
            else
              echo "$apk: INTERNET permission MISSING"
              exit 1
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshtools-android-apk
          path: flutter_ui/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  ios:
    name: iOS build no-codesign (Flutter + gomobile)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # mobile 子模块的 go 指令以 x/mobile 锁定版本为准（见 mobile/go.mod）
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install gomobile (version locked by mobile/go.mod)
        shell: bash
        run: |
          GOMOBILE_VERSION="$(cd mobile && go list -m -f '{{.Version}}' golang.org/x/mobile)"
          echo "gomobile version: $GOMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build iOS XCFramework from Go core
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p flutter_ui/plugins/sshtools_go/ios/Frameworks
          cd mobile
          gomobile bind -target=ios -ldflags "-s -w" \
            -o ../flutter_ui/plugins/sshtools_go/ios/Frameworks/Mobile.xcframework \
            .
          ls ../flutter_ui/plugins/sshtools_go/ios/Frameworks/

      # 同 Android job：双平台脚手架一起生成，避免图标工具缺目录失败
      - name: Generate iOS scaffolding
        working-directory: flutter_ui
        run: flutter create --platforms=android,ios --org com.ahasshtools --project-name ahasshtools_flutter .

      # 同 Android：把与桌面端共用的图标刷进 AppIcon.appiconset
      - name: Apply app icon
        working-directory: flutter_ui
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      # 应用显示名与桌面端统一（AHaSSHTools），改 Info.plist 两个键
      - name: Set app display name (iOS)
        working-directory: flutter_ui
        run: |
          python3 - <<'PYEOF'
          import plistlib
          path = "ios/Runner/Info.plist"
          with open(path, "rb") as fh:
              plist = plistlib.load(fh)
          plist["CFBundleName"] = "AHaSSHTools"
          plist["CFBundleDisplayName"] = "AHaSSHTools"
          # 与 Android 的回环明文放行对应：ATS 仅放行本地网络明文
          plist["NSAppTransportSecurity"] = {"NSAllowsLocalNetworking": True}
          with open(path, "wb") as fh:
              plistlib.dump(plist, fh)
          print("iOS display name set to AHaSSHTools")
          PYEOF

      - name: Build iOS app (no codesign)
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter build ios --no-codesign --debug

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshtools-ios-runner-app
          path: flutter_ui/build/ios/iphoneos/Runner.app
          retention-days: 7
