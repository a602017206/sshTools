name: Mobile Build

# 移动端（Flutter + 内嵌 Go）打包验证流水线。
# 本地不做打包：所有 gomobile 绑定与 Flutter 构建都在 GitHub 托管 runner 上完成。
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/mobile-flutter-gomobile'
    paths:
      - 'mobile/**'
      - 'internal/**'
      - 'flutter_ui/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/mobile.yml'

jobs:
  android:
    name: Android APK (Flutter + gomobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # mobile 子模块的 go 指令以 x/mobile 锁定版本为准（见 mobile/go.mod）
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install gomobile (version locked by mobile/go.mod)
        shell: bash
        run: |
          GOMOBILE_VERSION="$(cd mobile && go list -m -f '{{.Version}}' golang.org/x/mobile)"
          echo "gomobile version: $GOMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Test embedded Go module
        working-directory: mobile
        run: go test ./...

      - name: Build Android library from Go core
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          # gomobile 生成 AAR 后必须解包：Android 库工程（Flutter 插件）
          # 不能直接依赖本地 .aar，需拆成 classes.jar + jniLibs/*.so。
          PLUGIN_ANDROID=flutter_ui/plugins/sshtools_go/android
          mkdir -p "$PLUGIN_ANDROID/libs" "$PLUGIN_ANDROID/src/main/jniLibs"
          cd mobile
          gomobile bind -target=android -androidapi 24 -ldflags "-s -w" \
            -o "$RUNNER_TEMP/sshtools.aar" .
          cd "$RUNNER_TEMP"
          unzip -o -q sshtools.aar -d sshtools_aar
          cp sshtools_aar/classes.jar "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/libs/sshtools-classes.jar"
          cp -r sshtools_aar/jni/* "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/src/main/jniLibs/"
          find "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/src/main/jniLibs" -name '*.so' | sort
          ls -lh "$GITHUB_WORKSPACE/$PLUGIN_ANDROID/libs/"

      # 仓库未提交 Flutter 平台工程脚手架，统一在流水线里生成，
      # 避免本地无 Flutter SDK 时手写模板与工具链版本漂移。
      - name: Generate Android scaffolding
        working-directory: flutter_ui
        run: flutter create --platforms=android --org com.ahasshtools --project-name ahasshtools_flutter .

      # 固定发布签名：密钥只存在于 GitHub Secrets，解出后写 key.properties
      # 并给脚手架的 app/build.gradle.kts 追加签名配置（模板默认没有）。
      # 有了固定签名，后续版本才能覆盖安装、保留应用数据。
      # Secrets 缺失时（如 fork）跳过，走下面的 debug 兜底构建。
      - name: Inject release signing
        working-directory: flutter_ui/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KS_B64" ]; then
            echo "signing secrets missing, will fall back to debug build"
            exit 0
          fi
          KS_PATH="$RUNNER_TEMP/release.jks"
          echo "$KS_B64" | base64 -d > "$KS_PATH"
          cat > key.properties <<EOF
          storeFile=$KS_PATH
          storePassword=$KS_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF
          # 新版 Gradle 里 java 被扩展访问器占用，java.util.* 需靠文件头 import
          sed -i '1i import java.util.Properties\nimport java.io.FileInputStream' app/build.gradle.kts
          cat >> app/build.gradle.kts <<'EOF'

          // 由 mobile.yml 注入的发布签名（flutter create 的脚手架默认只有 debug 签名）
          val keystorePropsFile = rootProject.file("key.properties")
          val keystoreProps = Properties()
          if (keystorePropsFile.exists()) {
              keystoreProps.load(FileInputStream(keystorePropsFile))
          }
          android {
              signingConfigs {
                  create("release") {
                      if (keystorePropsFile.exists()) {
                          storeFile = file(keystoreProps.getProperty("storeFile"))
                          storePassword = keystoreProps.getProperty("storePassword")
                          keyAlias = keystoreProps.getProperty("keyAlias")
                          keyPassword = keystoreProps.getProperty("keyPassword")
                      }
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          echo "release signing injected"

      - name: Build APK
        working-directory: flutter_ui
        run: |
          flutter pub get
          if [ -f android/key.properties ]; then
            # 按 ABI 拆分，避免单个 APK 背着三个架构的 Go 库
            flutter build apk --release --split-per-abi
          else
            flutter build apk --debug
          fi
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshtools-android-apk
          path: flutter_ui/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  ios:
    name: iOS build no-codesign (Flutter + gomobile)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # mobile 子模块的 go 指令以 x/mobile 锁定版本为准（见 mobile/go.mod）
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install gomobile (version locked by mobile/go.mod)
        shell: bash
        run: |
          GOMOBILE_VERSION="$(cd mobile && go list -m -f '{{.Version}}' golang.org/x/mobile)"
          echo "gomobile version: $GOMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build iOS XCFramework from Go core
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p flutter_ui/plugins/sshtools_go/ios/Frameworks
          cd mobile
          gomobile bind -target=ios -ldflags "-s -w" \
            -o ../flutter_ui/plugins/sshtools_go/ios/Frameworks/Mobile.xcframework \
            .
          ls ../flutter_ui/plugins/sshtools_go/ios/Frameworks/

      - name: Generate iOS scaffolding
        working-directory: flutter_ui
        run: flutter create --platforms=ios --org com.ahasshtools --project-name ahasshtools_flutter .

      - name: Build iOS app (no codesign)
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter build ios --no-codesign --debug

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshtools-ios-runner-app
          path: flutter_ui/build/ios/iphoneos/Runner.app
          retention-days: 7
